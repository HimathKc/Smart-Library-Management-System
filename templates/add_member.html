<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Member — Smart Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
{% from '_sidebar.html' import sidebar %}
<div class="app-shell">
  {{ sidebar('add_member') }}
  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Add Member</span>
      <div class="topbar-right">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️</button>
        <div class="user-badge"><div class="user-avatar">A</div><span>Admin</span></div>
      </div>
    </header>

    <div class="page-body">
      <div class="page-header">
        <h1>Add a New Member</h1>
        <p>Register a new member to the library system.</p>
      </div>

      <div class="form-card">
        <form method="POST" action="{{ url_for('add_member') }}">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="e.g. Jane Smith" required />
          </div>
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" placeholder="e.g. jane@example.com" required />
          </div>
          <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" name="phone" placeholder="e.g. +94 77 123 4567" required />
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" name="address" placeholder="Optional" />
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;margin-top:6px;font-size:15px">
            Register Member →
          </button>
        </form>
        <div style="text-align:center;margin-top:18px">
          <a href="{{ url_for('members') }}" class="btn btn-ghost btn-sm">← Back to Members</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
